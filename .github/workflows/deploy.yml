# Staging after CI passes on main; production by promoting a commit that is
# live and healthy on staging, with a person's approval (ADRs 0015, 0024).
#
# Off until the repository variable DEPLOYS is set to "on", once staging
# exists. From then on nothing here skips itself: a missing secret fails the run.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to promote to production. It must be live on staging.
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: vars.DEPLOYS == 'on' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-migrations.mjs --no-base
      - id: prepare
        run: node scripts/release.mjs prepare
      - run: echo "$EXPECTED_SHA" > release-sha.txt
      - run: npx --yes @railway/cli@4 up --ci --service "$RAILWAY_SERVICE"
      - run: node scripts/release.mjs verify "${{ steps.prepare.outputs.previous }}"

  production:
    if: vars.DEPLOYS == 'on' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      EXPECTED_SHA: ${{ inputs.sha }}
    steps:
      - name: The commit is live on staging
        run: |
          test -n "$STAGING_API_URL" || { echo "::error::STAGING_API_URL is not set"; exit 1; }
          live=$(curl -sf "$STAGING_API_URL/health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          test "$live" = "$EXPECTED_SHA" || { echo "::error::Staging runs $live, not $EXPECTED_SHA. Promote only what staging runs."; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-migrations.mjs --no-base
      - id: prepare
        run: node scripts/release.mjs prepare
      - run: echo "$EXPECTED_SHA" > release-sha.txt
      - run: npx --yes @railway/cli@4 up --ci --service "$RAILWAY_SERVICE"
      - run: node scripts/release.mjs verify "${{ steps.prepare.outputs.previous }}"
